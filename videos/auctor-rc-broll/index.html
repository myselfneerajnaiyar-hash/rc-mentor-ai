<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b121c;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-diagnosis"
        class="scene"
        data-composition-id="01-diagnosis"
        data-composition-src="compositions/frames/01-diagnosis.html"
        data-start="0"
        data-duration="5.1"
        data-track-index="1"
      ></div>

      <div
        id="el-02-analytics"
        class="scene"
        data-composition-id="02-analytics"
        data-composition-src="compositions/frames/02-analytics.html"
        data-start="5.1"
        data-duration="2.8"
        data-track-index="1"
      ></div>

      <div
        id="el-03-birbal-feedback"
        class="scene"
        data-composition-id="03-birbal-feedback"
        data-composition-src="compositions/frames/03-birbal-feedback.html"
        data-start="7.8999999999999995"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-04-lockup"
        class="scene"
        data-composition-id="04-lockup"
        data-composition-src="compositions/frames/04-lockup.html"
        data-start="12.399999999999999"
        data-duration="1.6"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/music/instrumental.mp3"
        data-start="0"
        data-duration="14"
        data-track-index="11"
        data-volume="0.09"
      ></audio>

      <!-- SFX -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/interface/select.ogg"
        data-start="2.54"
        data-duration="0.05"
        data-track-index="20"
        data-volume="0.16"
      ></audio>
      <audio
        id="el-sfx-1"
        src="assets/sfx/interface/incorrect.ogg"
        data-start="2.73"
        data-duration="0.28"
        data-track-index="21"
        data-volume="0.18"
      ></audio>
      <audio
        id="el-sfx-2"
        src="assets/sfx/interface/reveal.ogg"
        data-start="4.08"
        data-duration="0.24"
        data-track-index="22"
        data-volume="0.13"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
