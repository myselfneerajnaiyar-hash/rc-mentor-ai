<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auctor Labs — launch film</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080b12;display:grid;place-items:center}canvas{height:min(100vh,177.78vw);width:min(56.25vh,100vw);display:block}</style></head><body><canvas id="film" width="1080" height="1920"></canvas><audio id="music" src="assets/music/score.mp3" preload="auto"></audio><script>
const c=document.querySelector('#film'),x=c.getContext('2d'),music=document.querySelector('#music');
const imgs={};for(const n of ['rc','workout','vocabulary','birbal','logo']){imgs[n]=new Image();imgs[n].src=`assets/${n==='logo'?'':'screens/'}${n==='logo'?'logo.png':n+'.png'}`;}
const scenes=[['rc','RC PRACTICE'],['workout','DAILY WORKOUT'],['vocabulary','VOCABULARY'],['birbal','BIRBAL AI']];
function ease(v){return 1-Math.pow(1-v,3)}function text(t,s,px,y,color='#f6f2e9',font='600'){x.font=`${font} ${s}px Arial`;x.fillStyle=color;x.textAlign='center';x.textBaseline='middle';x.fillText(t,540,y)}
function bg(t){let g=x.createLinearGradient(0,0,1080,1920);g.addColorStop(0,'#0d1220');g.addColorStop(.53,'#090d16');g.addColorStop(1,'#10101d');x.fillStyle=g;x.fillRect(0,0,1080,1920);let rad=x.createRadialGradient(540,780,10,540,780,850);rad.addColorStop(0,`rgba(77,74,174,${.18+.04*Math.sin(t*2)})`);rad.addColorStop(1,'transparent');x.fillStyle=rad;x.fillRect(0,0,1080,1920)}
function imageCover(im,dx,dy,dw,dh){if(!im?.complete||!im.naturalWidth)return;let k=Math.max(dw/im.width,dh/im.height),sw=dw/k,sh=dh/k;x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,dx,dy,dw,dh)}
function draw(t){bg(t);if(t<3){let a=ease(Math.min(1,t/.65));text("Reading isn't the problem.",65,540,820+20*(1-a),'#f0ede5','500');if(t>1.15)text('Understanding is.',74,540,940,'#f0ede5','700');x.fillStyle='#b6b7cb';text('CAT VARC, rethought.',26,540,1090,'#b6b7cb','400')}
else if(t<6){let a=ease(Math.min(1,(t-3)/.9));if(imgs.logo.complete)x.drawImage(imgs.logo,380,620,320,320);text('Meet Auctor Labs',68,540,1080+30*(1-a),'#f5f2ea','600');text('A NEW RHYTHM FOR READING',22,540,1180,'#a8a7c4','500')}
else if(t<14){let i=Math.min(3,Math.floor((t-6)/2)),local=(t-6)%2,scene=scenes[i],im=imgs[scene[0]];text(scene[1],26,540,270,'#d2d2e9','600');let p=ease(Math.min(1,local/.35));let w=720,h=1320,xx=180+(1-p)*80,yy=360+(1-p)*90;x.save();x.shadowColor='rgba(105,101,233,.3)';x.shadowBlur=70;x.fillStyle='#11131d';x.beginPath();x.roundRect(xx-12,yy-12,w+24,h+24,54);x.fill();x.shadowBlur=0;x.save();x.beginPath();x.roundRect(xx,yy,w,h,44);x.clip();imageCover(im,xx,yy,w,h);x.restore();x.strokeStyle='rgba(240,240,255,.2)';x.lineWidth=3;x.beginPath();x.roundRect(xx,yy,w,h,44);x.stroke();x.restore();text(['Read closely.','Make today count.','Keep the words.','Ask a better question.'][i],31,540,1760,'#f4f0e6','500')}
else if(t<18){let i=Math.min(2,Math.floor((t-14)/1.33)),word=['Practice.','Analyse.','Improve.'][i];let local=(t-14)%1.33,p=ease(Math.min(1,local/.25));x.save();x.translate(540,950+(1-p)*80);x.scale(.94+.06*p, .94+.06*p);text(word,106,0,0,'#f6f2e9','700');x.restore();text('ONE DAY AT A TIME',24,540,1100,'#a7a5c9','500')}
else {let p=ease(Math.min(1,(t-18)/.45));if(imgs.logo.complete)x.drawImage(imgs.logo,430,550,220,220);text('Auctor Labs',58,540,880,'#f4f1e9','600');text('Train for CAT VARC.',55,540,1080,'#f4f1e9','500');text('Every day.',65,540,1170,'#ffffff','700');text('auctor.in',28,540,1300,'#bfbed6','500')}
let vg=x.createRadialGradient(540,920,500,540,920,1300);vg.addColorStop(.55,'transparent');vg.addColorStop(1,'rgba(0,0,0,.5)');x.fillStyle=vg;x.fillRect(0,0,1080,1920)}
window.renderFrame=draw;draw(0);
</script></body></html>
